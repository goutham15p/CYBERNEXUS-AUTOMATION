why
name: CYBERNEXUS Video Builder

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      
      - name: Build CYBERNEXUS video
        env:
          PIXABAY_API_KEY: $.       {{ secrets.PIXABAY_API_KEY }}
        run: |
          python build_video.py


      - name: Save finished video
        uses: actions/upload-artifact@v4
        with:
          name: CYBERNEXUS-Episode-01
          path: output/cybernexus_episode01.mp4
          retention-days: 7
